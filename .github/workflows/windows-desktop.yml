name: Build LinTVPlus Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish Windows EXE and desktop update feed
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['apps/windows-desktop/**', 'public/logo.png', '.github/workflows/windows-desktop.yml']
  pull_request:
    branches: [main]
    paths: ['apps/windows-desktop/**', 'public/logo.png', '.github/workflows/windows-desktop.yml']

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-desktop
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/windows-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node smoke-test.cjs
        timeout-minutes: 3
      - name: Read desktop version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "value=$version" >> $env:GITHUB_OUTPUT
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: lintvplus-windows
          path: |
            apps/windows-desktop/dist/*.exe
            apps/windows-desktop/dist/*.blockmap
            apps/windows-desktop/dist/latest.yml
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lintvplus-windows
          path: dist
      - name: Publish desktop releases without changing Android latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="windows-v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "${{ github.sha }}" --title "LinTVPlus Windows $VERSION" --notes "Windows 客户端：快捷键隐藏、任务栏隐藏、透明度与鼠标移出隐藏。安装版支持应用内更新；portable 为免安装版。" --latest=false
          fi
          gh release upload "$tag" dist/*.exe dist/*.blockmap dist/latest.yml --clobber
          if ! gh release view windows-latest >/dev/null 2>&1; then
            gh release create windows-latest --target "${{ github.sha }}" --title "LinTVPlus Windows update feed" --notes "Windows 独立更新源，请从 windows-v 版本发布下载客户端。" --prerelease --latest=false
          fi
          gh release upload windows-latest dist/*.exe dist/*.blockmap --clobber
          gh release upload windows-latest dist/latest.yml --clobber
